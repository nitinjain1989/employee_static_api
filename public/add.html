<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Employee</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      margin: 0;
    }

    .container {
      max-width: 520px;
      margin: 60px auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .mobile-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .mobile-row select { width: 40%; }
    .mobile-row input { width: 60%; }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .secondary-btn {
      background: #eee;
      color: black;
    }

    #message {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">
  <h2 id="title">Add Employee</h2>

  <form id="employeeForm">
    <input type="text" id="name" placeholder="Name *" required />

    <div class="form-row">
      <select id="designation"></select>
      <select id="department"></select>
    </div>

    <select id="is_active">
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>

    <input type="text" id="img_url" placeholder="Image URL" />
    <input type="email" id="email" placeholder="Email *" required />

    <div class="form-row">
      <input type="text" id="city" placeholder="City" />
      <input type="text" id="country" placeholder="Country" />
    </div>

    <input type="date" id="joining_date" />

    <!-- 🔥 MOBILES -->
    <h4>Mobile Numbers</h4>

    <div id="mobileContainer">
      <div class="mobile-row">
        <select class="mobile-type">
          <option value="home">Home</option>
          <option value="office">Office</option>
          <option value="other">Other</option>
        </select>
        <input type="text" class="mobile-number" placeholder="Mobile number" />
      </div>
    </div>

    <button type="button" id="addMobileBtn">+ Add More</button>

    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <button class="secondary-btn" onclick="window.location.href='index.html'">
    ← Back
  </button>

  <p id="message"></p>
</div>

<script src="js/employee-form.js"></script>

</body>
</html>
