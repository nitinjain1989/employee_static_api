definitions:
  dto.CreateEmployeeRequest:
    properties:
      city:
        example: Noida
        type: string
      country:
        example: India
        type: string
      department:
        example: Engineering
        type: string
      designation:
        example: iOS Engineer
        type: string
      email:
        example: nitin@test.com
        type: string
      img_url:
        example: https://image.com/profile.jpg
        type: string
      is_active:
        type: boolean
      joining_date:
        example: "2024-01-01"
        type: string
      mobiles:
        items:
          $ref: '#/definitions/dto.MobileRequest'
        type: array
      name:
        example: Nitin Jain
        type: string
    required:
    - email
    - name
    type: object
  dto.EmployeeDetailResponse:
    properties:
      data:
        $ref: '#/definitions/dto.EmployeeResponse'
      message:
        type: string
      status:
        type: string
    type: object
  dto.EmployeeFilters:
    properties:
      departments:
        items:
          type: string
        type: array
      designations:
        items:
          type: string
        type: array
      mobile_types:
        items:
          $ref: '#/definitions/dto.FilterOption'
        type: array
      statuses:
        items:
          $ref: '#/definitions/dto.FilterOption'
        type: array
    type: object
  dto.EmployeeFiltersResponse:
    properties:
      data:
        $ref: '#/definitions/dto.EmployeeFilters'
      message:
        type: string
      status:
        type: string
    type: object
  dto.EmployeeListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.EmployeeResponse'
        type: array
      message:
        type: string
      meta:
        $ref: '#/definitions/dto.Meta'
      status:
        type: string
    type: object
  dto.EmployeeResponse:
    properties:
      city:
        type: string
      country:
        type: string
      deleted_at:
        type: string
      department:
        type: string
      designation:
        type: string
      email:
        type: string
      id:
        description: 'optional: keep or remove'
        type: string
      img_url:
        type: string
      is_active:
        type: boolean
      joining_date:
        type: string
      mobiles:
        items:
          $ref: '#/definitions/dto.MobileResponse'
        type: array
      name:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  dto.FilterOption:
    properties:
      label:
        type: string
      value:
        type: string
    type: object
  dto.Meta:
    properties:
      has_next_page:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
    type: object
  dto.MobileRequest:
    properties:
      number:
        example: "9876543210"
        type: string
      type:
        example: home
        type: string
    type: object
  dto.MobileResponse:
    properties:
      id:
        type: string
      number:
        type: string
      type:
        type: string
    type: object
  dto.UpdateEmployeeRequest:
    properties:
      city:
        type: string
      country:
        type: string
      department:
        type: string
      designation:
        type: string
      email:
        type: string
      img_url:
        type: string
      is_active:
        type: boolean
      joining_date:
        type: string
      mobiles:
        items:
          $ref: '#/definitions/dto.MobileRequest'
        type: array
      name:
        type: string
      version:
        description: "\U0001F525 required"
        type: integer
    type: object
  response.MessageResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/employees/{id}:
    patch:
      consumes:
      - application/json
      description: Updates employee details by ID. Supports partial updates. Maximum
        3 mobile numbers allowed. Returns conflict if version mismatch (last-write
        handling).
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: string
      - description: Employee update payload (max 3 mobiles allowed)
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Employee updated successfully
          schema:
            $ref: '#/definitions/dto.EmployeeDetailResponse'
        "400":
          description: Missing ID, invalid request body, or validation error
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "404":
          description: Employee not found
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "409":
          description: Conflict error (e.g., version mismatch)
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: Update an existing employee
      tags:
      - employees
  /employees:
    get:
      consumes:
      - application/json
      description: Fetch employees with pagination, search, and filters
      parameters:
      - description: Number of records to fetch
        example: 10
        in: query
        name: limit
        type: integer
      - description: Number of records to skip
        example: 0
        in: query
        name: offset
        type: integer
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Comma-separated designations
        in: query
        name: designation
        type: string
      - description: Comma-separated departments
        in: query
        name: department
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmployeeListResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: Get employees with filters
      tags:
      - employees
    post:
      consumes:
      - application/json
      description: Creates a new employee with basic details and up to 3 mobile numbers.
        Validates required fields before creation.
      parameters:
      - description: Employee payload (max 3 mobiles allowed)
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Employee created successfully
          schema:
            $ref: '#/definitions/dto.EmployeeDetailResponse'
        "400":
          description: Invalid request body, missing name, or too many mobiles
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: Create a new employee
      tags:
      - employees
  /employees/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an employee by its ID
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Employee deleted successfully
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "400":
          description: Missing employee ID
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: Delete an employee
      tags:
      - employees
    get:
      consumes:
      - application/json
      description: Fetch a single employee by its unique ID
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EmployeeDetailResponse'
        "400":
          description: Missing or invalid ID
          schema:
            $ref: '#/definitions/response.MessageResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: Get employee by ID
      tags:
      - employees
  /employees/filters:
    get:
      consumes:
      - application/json
      description: Fetch available filter values like designation, department, status,
        etc.
      produces:
      - application/json
      responses:
        "200":
          description: Filter data fetched successfully
          schema:
            $ref: '#/definitions/dto.EmployeeFiltersResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.MessageResponse'
      summary: Get employee filter options
      tags:
      - employees
swagger: "2.0"
